<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 336" role="img"
     aria-label="Signal chain of the wearable: an OTOS optical tracker supplies X, Y and heading while an MPU6050 supplies roll and pitch. The ESP32 packs both into a 512-byte JSON message at 10 Hz over MQTT. The mqtt_imu node converts inches to metres and applies exponential smoothing, then esp32_controller maps the result into the arm's workspace box.">
  <defs>
    <marker id="g-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5c24"/>
    </marker>
    <style>
      .b  { fill:#fdfbf6; stroke:#b9b1a0; stroke-width:1; }
      .bh { fill:#e4e0d6; stroke:#8d9299; stroke-width:1.2; }
      .bk { fill:#0f1216; stroke:#0f1216; }
      .n  { font:500 12px "IBM Plex Mono",monospace; fill:#1c1a16; }
      .nw { font:500 12px "IBM Plex Mono",monospace; fill:#efe9db; }
      .s  { font:10px "IBM Plex Mono",monospace; fill:#5c574e; }
      .sw { font:10px "IBM Plex Mono",monospace; fill:#a7a396; }
      .t  { font:10px "IBM Plex Mono",monospace; fill:#8a5c24; }
      .h  { font:500 10px "IBM Plex Mono",monospace; fill:#8d9299; letter-spacing:.12em; }
      .l  { stroke:#8a5c24; stroke-width:1.3; fill:none; }
    </style>
  </defs>

  <text class="h" x="14" y="20">ON THE WEARABLE</text>
  <text class="h" x="470" y="20">ON THE HOST</text>
  <path d="M452 10 V330" stroke="#c9c2b2" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <!-- sensors -->
  <rect class="bh" x="14" y="34" width="176" height="58" rx="2"/>
  <text class="n" x="26" y="54">OTOS · 0x17</text>
  <text class="s" x="26" y="69">x, y in inches</text>
  <text class="s" x="26" y="82">heading in degrees</text>

  <rect class="bh" x="14" y="112" width="176" height="58" rx="2"/>
  <text class="n" x="26" y="132">MPU6050 · 0x68</text>
  <text class="s" x="26" y="147">roll / pitch via atan2</text>
  <text class="s" x="26" y="160">accel ±8 g · gyro 500°/s</text>

  <text class="s" x="14" y="196">shared I²C — GPIO 21 / 22</text>

  <path class="l" d="M190 63 H252 V96" marker-end="url(#g-ah)"/>
  <path class="l" d="M190 141 H252 V126" marker-end="url(#g-ah)"/>

  <rect class="b" x="252" y="96" width="164" height="58" rx="2"/>
  <text class="n" x="264" y="116">ESP32 sketch</text>
  <text class="s" x="264" y="131">StaticJsonDocument&lt;512&gt;</text>
  <text class="s" x="264" y="144">delay(100) → 10 Hz</text>

  <path class="l" d="M416 125 H500" marker-end="url(#g-ah)"/>
  <text class="t" x="418" y="117">WiFi</text>

  <rect class="bk" x="500" y="96" width="230" height="58" rx="2"/>
  <text class="nw" x="512" y="116">esp32/dual_sensors</text>
  <text class="sw" x="512" y="132">{"otos":{x,y,h},</text>
  <text class="sw" x="512" y="145"> "orient":{r,p,y}, "ts":…}</text>

  <path class="l" d="M615 154 V186" marker-end="url(#g-ah)"/>

  <rect class="b" x="500" y="186" width="230" height="72" rx="2"/>
  <text class="n" x="512" y="206">mqtt_imu</text>
  <text class="s" x="512" y="221">inches × 0.0254 → metres</text>
  <text class="s" x="512" y="234">EMA α 0.3 position</text>
  <text class="s" x="512" y="247">EMA α 0.4 orientation</text>

  <path class="l" d="M730 222 H790 V252" marker-end="url(#g-ah)"/>
  <text class="t" x="736" y="214">/odom</text>
  <text class="t" x="736" y="240">/imu/data</text>

  <rect class="b" x="500" y="272" width="406" height="52" rx="2"/>
  <text class="n" x="512" y="291">esp32_controller</text>
  <text class="s" x="512" y="305">auto-calibrates the odom range, then clamps into</text>
  <text class="s" x="512" y="318">X[−0.08, 0.09]  Y[−0.18, 0.18]  Z[0.05, 0.25] m</text>
</svg>
