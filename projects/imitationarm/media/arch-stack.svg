<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img"
     aria-label="Four input sources — ESP32 glove, keyboard teleop and a trained policy — converge on the /move_to topic, which move_server turns into a joint trajectory for MuJoCo. MuJoCo publishes /joint_states, which pose_printer converts to servo commands on the Arduino serial port.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5c24"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8382e"/>
    </marker>
    <style>
      .b  { fill:#fdfbf6; stroke:#b9b1a0; stroke-width:1; }
      .bh { fill:#e4e0d6; stroke:#8d9299; stroke-width:1.2; }
      .bk { fill:#0f1216; stroke:#0f1216; }
      .n  { font:500 12px "IBM Plex Mono",monospace; fill:#1c1a16; }
      .nw { font:500 12px "IBM Plex Mono",monospace; fill:#efe9db; }
      .s  { font:10px "IBM Plex Mono",monospace; fill:#5c574e; }
      .sw { font:10px "IBM Plex Mono",monospace; fill:#a7a396; }
      .t  { font:10px "IBM Plex Mono",monospace; fill:#8a5c24; }
      .tr { font:10px "IBM Plex Mono",monospace; fill:#b8382e; }
      .h  { font:500 10px "IBM Plex Mono",monospace; fill:#8d9299; letter-spacing:.12em; }
      .l  { stroke:#8a5c24; stroke-width:1.3; fill:none; }
      .lr { stroke:#b8382e; stroke-width:1.3; fill:none; stroke-dasharray:5 3; }
    </style>
  </defs>

  <text class="h" x="14" y="20">DRIVERS</text>
  <text class="h" x="14" y="246">EXECUTION</text>

  <!-- ── drivers ───────────────────────────────────────────── -->
  <rect class="bh" x="14" y="32" width="150" height="46" rx="2"/>
  <text class="n" x="26" y="52">ESP32 glove</text>
  <text class="s" x="26" y="68">OTOS + MPU6050</text>

  <rect class="b" x="204" y="32" width="140" height="46" rx="2"/>
  <text class="n" x="216" y="52">mqtt_imu</text>
  <text class="s" x="216" y="68">bridge node</text>

  <rect class="b" x="384" y="32" width="160" height="46" rx="2"/>
  <text class="n" x="396" y="52">esp32_controller</text>
  <text class="s" x="396" y="68">continuous IK</text>

  <rect class="b" x="14" y="104" width="150" height="40" rx="2"/>
  <text class="n" x="26" y="123">keyboard_teleop</text>
  <text class="s" x="26" y="137">WASD / QE · 1 cm steps</text>

  <rect class="b" x="14" y="164" width="150" height="40" rx="2"/>
  <text class="n" x="26" y="183">policy_executor</text>
  <text class="s" x="26" y="197">trained BC policy · 10 Hz</text>

  <!-- glove chain -->
  <path class="l" d="M164 55 H204" marker-end="url(#ah)"/>
  <text class="t" x="167" y="47">MQTT</text>
  <path class="l" d="M344 55 H384" marker-end="url(#ah)"/>
  <text class="t" x="340" y="47">/odom</text>

  <!-- converge on /move_to -->
  <path class="l" d="M544 55 H612 V128" marker-end="url(#ah)"/>
  <path class="l" d="M164 124 H612" marker-end="url(#ah)"/>
  <path class="l" d="M164 184 H612 V150" marker-end="url(#ah)"/>

  <rect class="bk" x="612" y="106" width="132" height="36" rx="2"/>
  <text class="nw" x="624" y="129">/move_to</text>
  <text class="sw" x="756" y="122">geometry_msgs</text>
  <text class="sw" x="756" y="135">/Point</text>

  <!-- ── execution ─────────────────────────────────────────── -->
  <path class="l" d="M678 142 V258" marker-end="url(#ah)"/>

  <rect class="b" x="590" y="258" width="182" height="58" rx="2"/>
  <text class="n" x="602" y="278">move_server</text>
  <text class="s" x="602" y="293">gradient-descent IK</text>
  <text class="s" x="602" y="306">single-point traj · 0.15 s</text>

  <path class="l" d="M590 287 H452" marker-end="url(#ah)"/>
  <text class="t" x="452" y="279">follow_joint_trajectory</text>

  <rect class="b" x="284" y="258" width="168" height="58" rx="2"/>
  <text class="n" x="296" y="278">MuJoCo</text>
  <text class="s" x="296" y="293">2 kHz physics</text>
  <text class="s" x="296" y="306">+ controller manager</text>

  <path class="l" d="M368 316 V372" marker-end="url(#ah)"/>

  <rect class="bk" x="284" y="372" width="168" height="34" rx="2"/>
  <text class="nw" x="296" y="394">/joint_states</text>

  <path class="l" d="M284 389 H164" marker-end="url(#ah)"/>

  <rect class="b" x="14" y="362" width="150" height="56" rx="2"/>
  <text class="n" x="26" y="382">pose_printer</text>
  <text class="s" x="26" y="396">rad → servo degrees</text>
  <text class="s" x="26" y="409">20 Hz · sole serial owner</text>

  <path class="l" d="M89 418 V446" marker-end="url(#ah)"/>
  <rect class="bh" x="14" y="446" width="150" height="20" rx="2"/>
  <text class="s" x="26" y="460">Arduino · 115200 baud</text>

  <!-- hardware bypass -->
  <path class="lr" d="M84 204 V362" marker-end="url(#ahr)"/>
  <text class="tr" x="94" y="290">/arm/servo_commands</text>
  <text class="tr" x="94" y="304">hardware-only bypass</text>
</svg>
