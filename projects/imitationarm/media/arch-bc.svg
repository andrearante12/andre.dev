<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img"
     aria-label="The behavioural cloning pipeline. demo_recorder captures 13-dimensional observations and 4-dimensional actions at 10 Hz into JSON episodes labelled success or failure. The loader keeps only successful episodes and z-score normalises them. A three-layer MLP maps observation to action, and policy_executor runs it at 10 Hz back onto the /move_to topic. The place motion after a successful lift is scripted, not learned.">
  <defs>
    <marker id="c-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5c24"/>
    </marker>
    <style>
      .b  { fill:#fdfbf6; stroke:#b9b1a0; stroke-width:1; }
      .bk { fill:#0f1216; stroke:#0f1216; }
      .bs { fill:#f3e2e0; stroke:#b8382e; stroke-width:1; stroke-dasharray:4 3; }
      .n  { font:500 12px "IBM Plex Mono",monospace; fill:#1c1a16; }
      .nw { font:500 12px "IBM Plex Mono",monospace; fill:#efe9db; }
      .s  { font:10px "IBM Plex Mono",monospace; fill:#5c574e; }
      .sw { font:10px "IBM Plex Mono",monospace; fill:#a7a396; }
      .t  { font:10px "IBM Plex Mono",monospace; fill:#8a5c24; }
      .tr { font:10px "IBM Plex Mono",monospace; fill:#b8382e; }
      .h  { font:500 10px "IBM Plex Mono",monospace; fill:#8d9299; letter-spacing:.12em; }
      .l  { stroke:#8a5c24; stroke-width:1.3; fill:none; }
    </style>
  </defs>

  <text class="h" x="14" y="20">1 · CAPTURE</text>
  <text class="h" x="326" y="20">2 · TRAIN</text>
  <text class="h" x="646" y="20">3 · DEPLOY</text>

  <!-- capture -->
  <rect class="b" x="14" y="32" width="270" height="52" rx="2"/>
  <text class="n" x="26" y="52">human teleop in MuJoCo</text>
  <text class="s" x="26" y="67">keyboard or glove drives the arm</text>
  <text class="s" x="26" y="79">R randomises the cube each episode</text>

  <path class="l" d="M149 84 V108" marker-end="url(#c-ah)"/>

  <rect class="b" x="14" y="108" width="270" height="66" rx="2"/>
  <text class="n" x="26" y="128">demo_recorder · 10 Hz</text>
  <text class="s" x="26" y="144">obs 13-d = 7 joint pos + EE xyz + cube xyz</text>
  <text class="s" x="26" y="157">act  4-d = ΔEE xyz + gripper bit</text>
  <text class="s" x="26" y="169">operator labels each episode y / n</text>

  <path class="l" d="M149 174 V198" marker-end="url(#c-ah)"/>

  <rect class="bk" x="14" y="198" width="270" height="40" rx="2"/>
  <text class="nw" x="26" y="218">~/demonstrations/episodes/</text>
  <text class="sw" x="26" y="231">episode_XXXX.json</text>

  <path class="l" d="M284 218 H326 V116" marker-end="url(#c-ah)"/>

  <!-- train -->
  <rect class="b" x="326" y="92" width="270" height="52" rx="2"/>
  <text class="n" x="338" y="112">dataset.py</text>
  <text class="s" x="338" y="127">success_only filter</text>
  <text class="s" x="338" y="139">z-score norm, std clamped ≥ 1e−6</text>

  <path class="l" d="M461 144 V168" marker-end="url(#c-ah)"/>

  <rect class="b" x="326" y="168" width="270" height="66" rx="2"/>
  <text class="n" x="338" y="188">BCPolicy — MLP</text>
  <text class="s" x="338" y="204">13 → 256 → 256 → 4, ReLU</text>
  <text class="s" x="338" y="217">≈70K parameters</text>
  <text class="s" x="338" y="229">Adam · 200 epochs · lr 1e−4 · CPU</text>

  <path class="l" d="M461 234 V258" marker-end="url(#c-ah)"/>

  <rect class="bk" x="326" y="258" width="270" height="40" rx="2"/>
  <text class="nw" x="338" y="278">~/models/bc_cube_lift/best.pt</text>
  <text class="sw" x="338" y="291">weights + normalisation stats</text>

  <path class="l" d="M596 278 H646 V116" marker-end="url(#c-ah)"/>

  <!-- deploy -->
  <rect class="b" x="646" y="92" width="260" height="66" rx="2"/>
  <text class="n" x="658" y="112">policy_executor · 10 Hz</text>
  <text class="s" x="658" y="128">EE + predicted Δ → /move_to</text>
  <text class="s" x="658" y="141">gripper closes when output &gt; 0.5</text>
  <text class="s" x="658" y="153">timeout at 200 steps ≈ 20 s</text>

  <path class="l" d="M776 158 V186" marker-end="url(#c-ah)"/>

  <rect class="b" x="646" y="186" width="260" height="52" rx="2"/>
  <text class="n" x="658" y="206">lift detected</text>
  <text class="s" x="658" y="221">cube above z = 0.02 m</text>
  <text class="s" x="658" y="233">held for 10 ticks ≈ 1 s</text>

  <path class="l" d="M776 238 V266" marker-end="url(#c-ah)"/>

  <rect class="bs" x="646" y="266" width="260" height="52" rx="2"/>
  <text class="n" x="658" y="286">place sequence</text>
  <text class="tr" x="658" y="301">SCRIPTED, NOT LEARNED</text>
  <text class="s" x="658" y="313">four fixed waypoints to the drop zone</text>

  <text class="s" x="646" y="344">The learned half of pick-and-place is</text>
  <text class="s" x="646" y="357">the pick. The place is the next step.</text>
</svg>
