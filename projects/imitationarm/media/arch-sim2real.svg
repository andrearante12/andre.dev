<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img"
     aria-label="Two clock domains. Everything inside the simulation runs on MuJoCo's /clock, so it slows down or speeds up with the physics. pose_printer is deliberately pinned to use_sim_time false, so its 20 Hz timer keeps wall-clock rate, and the Arduino runs its own independent 50 Hz loop with a two-degree-per-tick slew limiter.">
  <defs>
    <marker id="s-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5c24"/>
    </marker>
    <style>
      .b  { fill:#fdfbf6; stroke:#b9b1a0; stroke-width:1; }
      .bh { fill:#e4e0d6; stroke:#8d9299; stroke-width:1.2; }
      .n  { font:500 12px "IBM Plex Mono",monospace; fill:#1c1a16; }
      .s  { font:10px "IBM Plex Mono",monospace; fill:#5c574e; }
      .t  { font:10px "IBM Plex Mono",monospace; fill:#8a5c24; }
      .h  { font:500 10px "IBM Plex Mono",monospace; fill:#8d9299; letter-spacing:.12em; }
      .hr { font:500 10px "IBM Plex Mono",monospace; fill:#b8382e; letter-spacing:.12em; }
      .l  { stroke:#8a5c24; stroke-width:1.3; fill:none; }
    </style>
  </defs>

  <!-- sim-time domain -->
  <rect x="14" y="26" width="452" height="264" rx="3" fill="#e9e4d6" stroke="#c9c2b2"/>
  <text class="h" x="28" y="48">SIM TIME — use_sim_time: true</text>
  <text class="s" x="28" y="64">every node below takes its clock from /clock</text>

  <rect class="b" x="28" y="80" width="240" height="52" rx="2"/>
  <text class="n" x="40" y="100">MuJoCo physics</text>
  <text class="s" x="40" y="115">timestep 0.0005 s → 2 kHz</text>
  <text class="s" x="40" y="127">implicitfast · Newton solver</text>

  <path class="l" d="M148 132 V158" marker-end="url(#s-ah)"/>

  <rect class="b" x="28" y="158" width="240" height="52" rx="2"/>
  <text class="n" x="40" y="178">ros2_control</text>
  <text class="s" x="40" y="193">update_rate 100 Hz</text>
  <text class="s" x="40" y="205">JointTrajectoryController</text>

  <path class="l" d="M148 210 V240" marker-end="url(#s-ah)"/>

  <rect x="28" y="240" width="240" height="34" rx="2" fill="#0f1216"/>
  <text x="40" y="262" font="500 12px 'IBM Plex Mono',monospace"
        style="font:500 12px 'IBM Plex Mono',monospace" fill="#efe9db">/joint_states</text>

  <!-- boundary -->
  <path d="M466 20 V320" stroke="#b8382e" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <text class="hr" x="476" y="20">CLOCK BOUNDARY</text>

  <path class="l" d="M268 257 H520" marker-end="url(#s-ah)"/>
  <text class="t" x="300" y="249">latest message is sampled, not awaited</text>

  <!-- wall-clock domain -->
  <rect x="520" y="26" width="386" height="264" rx="3" fill="#e9e4d6" stroke="#c9c2b2"/>
  <text class="h" x="534" y="48">WALL CLOCK — use_sim_time: false</text>
  <text class="s" x="534" y="64">servos do not care how fast physics runs</text>

  <rect class="b" x="534" y="234" width="358" height="52" rx="2"/>
  <text class="n" x="546" y="254">pose_printer</text>
  <text class="s" x="546" y="269">create_timer(0.05) → 20 Hz regardless of sim speed</text>
  <text class="s" x="546" y="281">round(direction × degrees(rad) + offset) → "servoN=angle\n"</text>

  <path class="l" d="M713 234 V196" marker-end="url(#s-ah)"/>
  <text class="t" x="722" y="218">115200 baud</text>

  <rect class="bh" x="534" y="144" width="358" height="52" rx="2"/>
  <text class="n" x="546" y="164">Arduino Nano + PCA9685</text>
  <text class="s" x="546" y="179">own 50 Hz loop · MAX_STEP 2.0°/tick ≈ 100 °/s slew limit</text>
  <text class="s" x="546" y="191">setPWMFreq(60) · pulse 125–625 mapped from 0–180°</text>

  <path class="l" d="M713 144 V110" marker-end="url(#s-ah)"/>

  <rect class="bh" x="534" y="80" width="358" height="30" rx="2"/>
  <text class="s" x="546" y="99">6 servos on the physical arm</text>
</svg>
