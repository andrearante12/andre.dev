<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andre Arante — Robotics & Computer Vision Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #130f0a;
    --text: #f1eadf;
    --muted: #b6a78f;
    --mono: 'DM Mono', monospace;
    --display: 'Syne', sans-serif;
    --body: 'DM Sans', sans-serif;
    --teal: #00d4aa;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--body); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- 3D canvas ---- */
  #scene { position: fixed; inset: 0; z-index: 0; }
  #scene canvas { display: block; }

  /* ---- Detection overlay ---- */
  #detection-layer { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .det-box {
    position: absolute; left: 0; top: 0;
    border: 1.5px solid var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 16px -2px var(--accent), inset 0 0 18px -10px var(--accent);
    transition: opacity .18s ease;
    will-change: transform, width, height;
  }
  .det-box .c {
    position: absolute; width: 12px; height: 12px;
    border: 2px solid var(--accent);
  }
  .c-tl { left: -2px; top: -2px; border-right: 0; border-bottom: 0; }
  .c-tr { right: -2px; top: -2px; border-left: 0; border-bottom: 0; }
  .c-bl { left: -2px; bottom: -2px; border-right: 0; border-top: 0; }
  .c-br { right: -2px; bottom: -2px; border-left: 0; border-top: 0; }
  .det-label {
    position: absolute; top: -23px; left: -1.5px;
    display: inline-flex; align-items: baseline; gap: 7px;
    background: var(--accent); color: #0c0a07;
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.04em; padding: 3px 9px; border-radius: 3px 3px 3px 0;
    white-space: nowrap;
  }
  .det-label i { font-style: normal; font-size: 9px; text-transform: uppercase; opacity: 0.7; letter-spacing: 0.12em; }
  .det-box.active { box-shadow: 0 0 26px 0 var(--accent), inset 0 0 22px -8px var(--accent); }

  /* ---- HUD ---- */
  .hud { position: fixed; z-index: 20; pointer-events: none; }
  .hud * { pointer-events: auto; }
  .hud-top {
    top: 0; left: 0; right: 0; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
  }
  .brand { display: flex; flex-direction: column; line-height: 1.1; text-decoration: none; }
  .brand b { font-family: var(--display); font-weight: 800; font-size: 16px; color: var(--text); letter-spacing: -0.01em; }
  .brand span { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 2px; }
  .hud-right { display: flex; align-items: center; gap: 14px; }
  .scan-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--teal); background: rgba(0,212,170,0.08);
    border: 1px solid rgba(0,212,170,0.35); border-radius: 4px;
    padding: 8px 14px; cursor: pointer; transition: all .2s;
  }
  .scan-btn:hover { background: rgba(0,212,170,0.16); }
  .scan-btn.on { background: var(--teal); color: #07120f; border-color: var(--teal); box-shadow: 0 0 18px -4px var(--teal); }
  .research-btn { color: #8aa0ff; background: rgba(91,157,255,0.08); border-color: rgba(91,157,255,0.4); }
  .research-btn:hover { background: rgba(91,157,255,0.18); }
  .photo-link { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-decoration: none; transition: color .2s; }
  .photo-link:hover { color: var(--text); }

  .hud-bottom { left: 0; right: 0; bottom: 0; padding: 0 28px 22px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  #hud-chips { display: flex; flex-wrap: wrap; gap: 8px; max-width: 70vw; }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.03em;
    color: var(--text); background: rgba(20,16,11,0.6); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-left: 2px solid var(--accent);
    border-radius: 4px; padding: 7px 13px; cursor: pointer; transition: all .18s;
  }
  .chip:hover { background: rgba(40,32,22,0.85); border-color: var(--accent); transform: translateY(-2px); }
  .hud-hint {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); opacity: 0.8; white-space: nowrap; text-align: right;
  }
  .hud-hint b { color: var(--text); font-weight: 500; }

  /* ---- Project panel ---- */
  #panel {
    position: fixed; top: 0; right: 0; z-index: 30; height: 100%;
    width: min(440px, 92vw);
    background: linear-gradient(180deg, rgba(22,18,12,0.96), rgba(15,12,8,0.98));
    backdrop-filter: blur(18px);
    border-left: 1px solid rgba(255,255,255,0.08);
    box-shadow: -30px 0 80px -20px rgba(0,0,0,0.6);
    transform: translateX(105%); transition: transform .5s cubic-bezier(.16,1,.3,1);
    overflow-y: auto;
  }
  #panel.open { transform: translateX(0); }
  #panel-inner { padding: 64px 40px 48px; }
  .panel-close {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); background: none; border: none; cursor: pointer; padding: 0;
    margin-bottom: 28px; transition: color .2s;
  }
  .panel-close:hover { color: var(--text); }
  .panel-bar { width: 56px; height: 3px; border-radius: 2px; background: var(--accent); margin-bottom: 20px; }
  .panel-type { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .panel-title { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1.04; letter-spacing: -0.025em; margin-bottom: 18px; }
  .panel-blurb { color: rgba(241,234,223,0.82); font-size: 15px; line-height: 1.7; margin-bottom: 30px; }
  .panel-section-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .panel-highlights { list-style: none; display: flex; flex-direction: column; gap: 11px; margin-bottom: 30px; }
  .panel-highlights li { position: relative; padding-left: 20px; font-size: 14px; line-height: 1.6; color: rgba(241,234,223,0.74); }
  .panel-highlights li::before { content: '▸'; position: absolute; left: 0; top: 1px; color: var(--accent); font-size: 12px; }
  .panel-stack { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 34px; }
  .panel-stack span { font-family: var(--mono); font-size: 11px; padding: 5px 11px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }
  .panel-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .panel-btn { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; padding: 11px 18px; border-radius: 4px; transition: all .2s; }
  .panel-btn.primary { background: var(--accent); color: #0c0a07; font-weight: 500; }
  .panel-btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .panel-btn.ghost { border: 1px solid rgba(255,255,255,0.16); color: var(--text); }
  .panel-btn.ghost:hover { border-color: var(--text); }

  /* ---- CV detection inspector panel ---- */
  .det-panel { position: relative; padding: 56px 34px 44px; }
  .det-panel .panel-close { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 26px; transition: color .2s; }
  .det-panel .panel-close:hover { color: var(--text); }
  .det-corner { position: absolute; width: 18px; height: 18px; border: 2px solid var(--accent); opacity: 0.8; }
  .det-corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; }
  .det-corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; }
  .det-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .det-status { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--accent); }
  .det-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: detpulse 1.4s ease-in-out infinite; }
  @keyframes detpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .det-conf { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  .det-classrow { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  .det-classrow span:first-child { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); padding: 2px 7px; border-radius: 3px; }
  .det-title { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1.02; letter-spacing: -0.025em; margin-bottom: 16px; overflow-wrap: break-word; }
  .det-confbar { height: 4px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 10px; }
  .det-confbar i { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .det-coords { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; color: var(--muted); opacity: 0.8; margin-bottom: 26px; }
  .det-blurb { color: rgba(241,234,223,0.82); font-size: 15px; line-height: 1.7; margin-bottom: 28px; }
  .det-seclabel { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  .det-list { list-style: none; display: flex; flex-direction: column; gap: 11px; margin-bottom: 28px; }
  .det-list li { position: relative; padding-left: 20px; font-size: 14px; line-height: 1.6; color: rgba(241,234,223,0.74); }
  .det-list li::before { content: '⟶'; position: absolute; left: 0; top: 0; color: var(--accent); font-size: 11px; font-family: var(--mono); }
  .det-stack { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 32px; }
  .det-stack span { font-family: var(--mono); font-size: 11px; padding: 5px 11px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }
  .det-actions { display: flex; }
  .det-gh { display: inline-flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; padding: 12px 20px; border-radius: 4px; background: var(--accent); color: #0c0a07; font-weight: 500; transition: all .2s; }
  .det-gh:hover { filter: brightness(1.1); transform: translateY(-1px); }

  /* ---- Intro ---- */
  #intro {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px;
    background: radial-gradient(120% 90% at 50% 40%, rgba(30,22,12,0.55), rgba(12,9,6,0.92));
    backdrop-filter: blur(3px);
    transition: opacity .8s ease, visibility .8s;
  }
  #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); margin-bottom: 22px; }
  .intro-title { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 8vw, 104px); line-height: 0.95; letter-spacing: -0.03em; }
  .intro-title .stroke { color: transparent; -webkit-text-stroke: 1.4px rgba(241,234,223,0.4); }
  .intro-sub { font-family: var(--body); font-weight: 300; font-size: clamp(15px, 2vw, 19px); color: var(--muted); max-width: 480px; margin: 24px auto 40px; line-height: 1.6; }
  .enter-btn {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #0c0a07; background: var(--text); border: none; border-radius: 5px;
    padding: 15px 34px; cursor: pointer; transition: all .2s;
  }
  .enter-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -10px rgba(241,234,223,0.4); }
  .intro-hint { margin-top: 28px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); opacity: 0.7; }

  @media (max-width: 640px) {
    .hud-top { padding: 0 16px; height: 56px; }
    .hud-bottom { padding: 0 16px 16px; flex-direction: column; align-items: flex-start; }
    .hud-hint { display: none; }
    #panel-inner { padding: 56px 26px 40px; }
    .panel-title { font-size: 30px; }
  }

  /* ---- LUMINA smart-light app (IoT project) ---- */
  #panel.lumina-mode {
    background: linear-gradient(180deg, #101b30 0%, #0a1120 100%);
    border-left: 1px solid rgba(90,140,210,0.18);
  }
  #panel.lumina-mode #panel-inner { padding: 0; }
  .lum-app { padding: 14px 22px 40px; font-family: -apple-system, 'DM Sans', sans-serif; }
  .lum-close { color: #6f86a8; margin: 14px 0 6px; }
  .lum-close:hover { color: #cfe0f5; }
  .lum-status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #e8eefb; font-weight: 600; padding: 4px 4px 0; letter-spacing: 0.02em; }
  .lum-status-r { letter-spacing: 0.15em; font-size: 12px; }
  .lum-title { text-align: center; color: #3aa0ff; font-weight: 400; font-size: 38px; letter-spacing: 0.22em; margin: 14px 0 22px; }
  .lum-card {
    background: rgba(28,42,68,0.45); border: 1px solid rgba(120,160,215,0.14);
    border-radius: 18px; padding: 22px 20px; margin-bottom: 22px;
  }
  .lum-card.all { background: rgba(34,52,84,0.42); border-color: rgba(120,170,255,0.28); }
  .lum-card h3 { text-align: center; color: #e8eefb; font-weight: 700; font-size: 16px; letter-spacing: 0.16em; margin-bottom: 18px; }
  .lum-card.is-off h3 { color: #7e8ba3; }
  .lum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .lum-onoff { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
  .lum-btn {
    border: none; border-radius: 12px; padding: 14px 10px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 14px; letter-spacing: 0.06em;
    color: #fff; transition: transform .12s, filter .12s;
  }
  .lum-btn:active { transform: scale(0.96); }
  .lum-btn:hover { filter: brightness(1.08); }
  .lum-btn.on { background: #21bd77; }
  .lum-btn.off { background: #ef4d4d; }
  .lum-btn.cool { background: #79aef6; color: #16263f; }
  .lum-btn.warm { background: #f5b324; color: #3a2c06; }
  .lum-btn.default { display: block; width: 60%; margin: 4px auto 18px; background: #3a475e; padding: 13px; }
  .lum-slider { margin-top: 16px; }
  .lum-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .lum-row span { color: #aab9d2; font-size: 14px; }
  .lum-row b { color: #e8eefb; font-size: 14px; font-weight: 600; }
  .lum-slider input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 5px;
    border-radius: 4px; background: #2b3a55; outline: none;
  }
  .lum-slider input[type=range].tone { background: linear-gradient(90deg, #79aef6, #f5b324); }
  .lum-slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #29a3ff; border: 2px solid #eaf3ff; cursor: pointer;
    box-shadow: 0 0 10px -1px #29a3ff;
  }
  .lum-slider input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; background: #29a3ff; border: 2px solid #eaf3ff; cursor: pointer;
  }
  .lum-foot { color: #7e8ba3; font-size: 12px; line-height: 1.6; text-align: center; margin-top: 6px; }
  .lum-foot a { color: #3aa0ff; text-decoration: none; }

  /* ---- Left-docked detail panel (device focus) ---- */
  #panel.left { left: 0; right: auto; border-left: none; border-right: 1px solid rgba(255,255,255,0.08); box-shadow: 30px 0 80px -20px rgba(0,0,0,0.6); transform: translateX(-105%); }
  #panel.left.open { transform: translateX(0); }

  /* ---- LUMINA app mapped onto the phone's 3D screen (CSS homography) ---- */
  #screen-app { position: fixed; top: 0; left: 0; z-index: 35; width: 300px; height: 624px; transform-origin: 0 0; display: none; will-change: transform; pointer-events: none; }
  #screen-app.mounted { display: block; }
  #screen-app.off { visibility: hidden; }
  #screen-app.active { pointer-events: auto; }
  .screen-frame { position: relative; width: 100%; height: 100%; background: #06090f; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px rgba(58,160,255,0.18); }
  #screen-app.active .screen-frame { box-shadow: 0 0 50px -6px rgba(58,160,255,0.5); }
  .screen-close { position: absolute; top: 10px; right: 10px; z-index: 4; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.14); color: #cfe0f5; border: none; cursor: pointer; font-size: 13px; transition: background .2s; display: none; }
  #screen-app.active .screen-close { display: block; }
  .screen-close:hover { background: rgba(255,255,255,0.26); }
  .screen-body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #101b30 0%, #0a1120 100%); }
  #screen-app.active .screen-body { overflow-y: auto; }
  .screen-body::-webkit-scrollbar { width: 0; }
  .screen-body .lum-app { padding: 30px 18px 28px; }
  .screen-body .lum-title { font-size: 32px; margin: 10px 0 18px; }

  /* ---- Photography gallery modal ---- */
  #photo-modal { position: fixed; inset: 0; z-index: 45; display: none; }
  #photo-modal.open { display: block; }
  .pm-backdrop { position: absolute; inset: 0; background: rgba(8,6,4,0.78); backdrop-filter: blur(6px); animation: pmfade .3s ease; }
  @keyframes pmfade { from { opacity: 0; } to { opacity: 1; } }
  .pm-sheet { position: absolute; inset: 3.5vh 3vw; background: linear-gradient(180deg, #17120c 0%, #110d08 100%); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.7); display: flex; flex-direction: column; overflow: hidden; animation: pmrise .4s cubic-bezier(.16,1,.3,1); }
  @keyframes pmrise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .pm-corner { position: absolute; width: 16px; height: 16px; border: 2px solid var(--teal); opacity: 0.55; z-index: 3; }
  .pm-corner.tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .pm-corner.tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .pm-corner.bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .pm-corner.br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }
  .pm-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 30px 40px 18px; }
  .pm-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; }
  .pm-title { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 4vw, 52px); letter-spacing: -0.025em; line-height: 1; }
  .pm-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-top: 12px; }
  .pm-close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); color: var(--text); font-size: 15px; cursor: pointer; flex-shrink: 0; transition: all .2s; }
  .pm-close:hover { border-color: var(--text); background: rgba(255,255,255,0.12); }
  .pm-filters { display: flex; gap: 6px; padding: 0 40px 16px; flex-wrap: wrap; }
  .pm-filter { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .18s; }
  .pm-filter:hover { color: var(--text); border-color: var(--border-hover); }
  .pm-filter.active { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 45%, transparent); background: rgba(0,212,170,0.08); }
  .pm-scroll { flex: 1; overflow-y: auto; padding: 8px 40px 40px; }
  .pm-scroll::-webkit-scrollbar { width: 8px; }
  .pm-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
  .pm-masonry { columns: 3; column-gap: 14px; }
  .pm-item { break-inside: avoid; margin-bottom: 14px; position: relative; border-radius: 7px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.06); }
